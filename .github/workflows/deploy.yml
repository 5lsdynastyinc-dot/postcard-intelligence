name: Deploy POSTCARD to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: postcard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify integrity controls
        run: npm test
      - name: Prepare public site
        run: |
          mkdir -p dist
          cp index.html jp-assist.html qts-hero.jpg _headers dist/
      - name: Deploy exact commit
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=postcard-intelligence --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed public and database endpoints
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$DEPLOYMENT_URL/" >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$DEPLOYMENT_URL/api/health" >health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("health.json","utf8"));if(h.ok!==true||h.database!=="connected")process.exit(1)'
          {
            echo "### POSTCARD production deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment ID: $DEPLOYMENT_ID"
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo "- Public page: reachable"
            echo "- Database health: connected"
          } >> "$GITHUB_STEP_SUMMARY"

